[package]
name = "rcn"
version = "0.1.0"
edition = "2021"
description = "Rust bit-mixer + BWT + DP-LZP compressor aiming to beat zstd -19 on text"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rinchen/rcn"

[dependencies]
clap = { version = "4", features = ["derive"] }
byteorder = "1"
crc32fast = "1"
thiserror = "1"
ans = "0.4.0"
divsufsort = "2"
mimalloc = "0.1"
rayon = "1"

[features]
default = ["two_pass"]
two_pass = []
no_avx2 = []

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bin]]
name = "rcn"
path = "src/main.rs"

[[bench]]
name = "throughput"
harness = false

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
