name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build
    - name: Run tests
      run: cargo test --features no_avx2
